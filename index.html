<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>thedesigns.org | Tri služby</title>
  <meta name="description" content="Signal House — branding, web a marketing. Everlight — svadobné foto a video. Priemyselná automatizácia PLC a robotika.">
  <link rel="stylesheet" href="./css/design-system.css">
  <style>
    :root {
      --text: var(--color-hub-ink);
      --glass: rgba(255, 255, 255, 0.1);
      --border: rgba(255, 255, 255, 0.3);
      --shadow: rgba(0, 0, 0, 0.4);
      --blur: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, var(--color-hub-accent) 0%, transparent 45%),
        radial-gradient(circle at 85% 18%, #00bfff 0%, transparent 40%),
        radial-gradient(circle at 52% 85%, #ff2f8f 0%, transparent 38%),
        linear-gradient(135deg, var(--color-hub-bg) 0%, #141938 100%);
    }

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 3px 3px;
      mix-blend-mode: soft-light;
      opacity: 0.3;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-block: 72px var(--ds-lg);
    }

    .lang-switch {
      position: fixed;
      top: var(--ds-md);
      right: var(--ds-md);
      display: flex;
      gap: var(--ds-sm);
      z-index: 20;
    }

    .lang-btn {
      border: 1px solid rgba(255, 255, 255, 0.45);
      background: rgba(20, 24, 55, 0.45);
      color: var(--text);
      border-radius: 999px;
      padding: 0.5rem 0.8rem;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .lang-btn:hover,
    .lang-btn.active {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.75);
    }

    .hub-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--ds-gutter);
      align-items: stretch;
    }

    .col {
      min-height: 72vh;
      position: relative;
      border-radius: var(--ds-r-lg);
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
      box-shadow: 0 25px 50px -20px var(--shadow);
      overflow: hidden;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: var(--ds-gutter);
      transition: transform 0.45s ease, box-shadow 0.45s ease, border-color 0.45s ease;
      isolation: isolate;
    }

    .col img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.42;
      z-index: -2;
      transition: transform 0.5s ease, opacity 0.35s ease;
    }

    .col::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(8, 10, 29, 0.92) 0%, rgba(8, 10, 29, 0.35) 50%, rgba(8, 10, 29, 0.25) 100%);
      z-index: -1;
    }

    .col:hover img,
    .col:focus-visible img {
      transform: scale(1.05);
      opacity: 0.5;
    }

    .col:hover,
    .col:focus-visible {
      transform: translateY(-8px);
      box-shadow: 0 35px 70px -24px rgba(0, 0, 0, 0.75);
      border-color: rgba(255, 255, 255, 0.65);
      outline: none;
    }

    .ink {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: var(--ds-sm);
      width: 100%;
    }

    .ico {
      width: 44px;
      height: 44px;
      border-radius: var(--ds-r-md);
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(7, 9, 22, 0.5);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .ico svg {
      width: 22px;
      height: 22px;
      stroke: rgba(235, 245, 255, 0.96);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .label {
      display: inline-block;
      padding: 0.45rem 0.75rem;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: rgba(8, 8, 20, 0.35);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .col h2 {
      font-family: var(--font-headline);
      font-weight: 400;
      font-size: clamp(1.5rem, 2vw, 2.1rem);
      line-height: 1.15;
      text-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
      width: 100%;
    }

    .col p {
      font-size: 0.92rem;
      opacity: 0.9;
      line-height: 1.5;
      width: 100%;
      max-width: none;
      min-height: 3em;
    }

    @media (max-width: 980px) {
      .hub-grid {
        grid-template-columns: 1fr;
      }
      .col {
        min-height: 36vh;
      }
      .col p {
        min-height: 0;
      }
    }
  </style>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>

  <div class="lang-switch">
    <button class="lang-btn active" type="button" data-lang="sk">SK</button>
    <button class="lang-btn" type="button" data-lang="de">DE</button>
  </div>

  <main class="page ds-container">
    <div class="hub-grid">
      <a class="col" href="./weby/" aria-label="Signal House branding a marketing">
        <img src="./img/nx/tstimg.png" alt="Design studio — vizuálna identita" loading="lazy">
        <div class="ink">
          <div class="ico" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 2l3 6h6l-5 4 2 7-6-4-6 4 2-7-5-4h6z"/></svg>
          </div>
          <span class="label" data-i18n="label1">Sektor 01</span>
          <h2 data-i18n="title1">Signal House</h2>
          <p data-i18n="text1">Branding, web, e-shop, sociálne siete a marketing pod jednou strechou.</p>
        </div>
      </a>

      <a class="col" href="./foto/" aria-label="Everlight svadobné foto a video">
        <img src="./foto/wedding/editorial-hero.jpg" alt="Everlight — elegantná svadobná produkcia" loading="lazy">
        <div class="ink">
          <div class="ico" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M20 12a8 8 0 1 1-16 0"/></svg>
          </div>
          <span class="label" data-i18n="label2">Sektor 02</span>
          <h2 data-i18n="title2">Everlight</h2>
          <p data-i18n="text2">Svadobné foto, video, drone a rezervácia termínu v kalendári.</p>
        </div>
      </a>

      <a class="col" href="./elektro/" aria-label="Priemyselná automatizácia">
        <img src="./elektro/images/engineer-site-premium.jpg" alt="Priemyselná automatizácia — technici pri rozvádzači" loading="lazy">
        <div class="ink">
          <div class="ico" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 2v6"/><path d="M12 16v6"/><path d="M2 12h6"/><path d="M16 12h6"/><circle cx="12" cy="12" r="4"/></svg>
          </div>
          <span class="label" data-i18n="label3">Sektor 03</span>
          <h2 data-i18n="title3">Automatizácia</h2>
          <p data-i18n="text3">Staff augmentation — PLC (TIA Portal) a elektrikári na commissioning v DE/EÚ.</p>
        </div>
      </a>
    </div>
  </main>

  <script>
    const dictionary = {
      sk: {
        label1: "Sektor 01", title1: "Signal House",
        text1: "Branding, web, e-shop, sociálne siete a marketing pod jednou strechou.",
        label2: "Sektor 02", title2: "Everlight",
        text2: "Svadobné foto, video, drone a rezervácia termínu v kalendári.",
        label3: "Sektor 03", title3: "Automatizácia",
        text3: "Staff augmentation — PLC (TIA Portal) a elektrikári na commissioning v DE/EÚ."
      },
      de: {
        label1: "Bereich 01", title1: "Signal House",
        text1: "Branding, Web, Shop, Social Media und Marketing aus einer Hand.",
        label2: "Bereich 02", title2: "Everlight",
        text2: "Hochzeitsfoto, Video, Drohne und Terminbuchung im Kalender.",
        label3: "Bereich 03", title3: "Automatisierung",
        text3: "Staff Augmentation — SPS (TIA Portal) und Elektriker fuer Inbetriebnahme in DE/EU."
      }
    };

    const buttons = document.querySelectorAll(".lang-btn");
    const targets = document.querySelectorAll("[data-i18n]");

    function setLanguage(lang) {
      const pack = dictionary[lang];
      if (!pack) return;
      document.documentElement.lang = lang;
      targets.forEach((el) => {
        const key = el.getAttribute("data-i18n");
        if (pack[key]) el.textContent = pack[key];
      });
      buttons.forEach((btn) => btn.classList.toggle("active", btn.dataset.lang === lang));
      try { localStorage.setItem("td-lang", lang); } catch (_) {}
    }

    buttons.forEach((btn) => btn.addEventListener("click", () => setLanguage(btn.dataset.lang)));
    try {
      const saved = localStorage.getItem("td-lang");
      setLanguage(saved && dictionary[saved] ? saved : "sk");
    } catch (_) { setLanguage("sk"); }
  </script>
</body>
</html>
