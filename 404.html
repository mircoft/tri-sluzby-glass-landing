<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — thedesigns.org</title>
  <meta name="description" content="Stránka sa nenašla.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#050b18">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#050b18;
      --text:#ecf4ff;
      --muted:rgba(236,244,255,.72);
      --hair:rgba(255,255,255,.12);
      --accent:#55a7ff;
      --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      min-height:100vh;
      font-family:Inter,ui-sans-serif,system-ui,sans-serif;
      color:var(--text);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:32px 20px;
      text-align:center;
      background:var(--bg);
      -webkit-font-smoothing:antialiased;
    }
    .code{
      font-family:var(--mono);
      font-size:clamp(4rem,14vw,7rem);
      font-weight:900;
      letter-spacing:-0.04em;
      line-height:1;
      background:linear-gradient(135deg,#fff 0%,var(--accent) 100%);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      margin-bottom:12px;
      opacity:0;
      transform:translateY(30px) scale(.9);
    }
    h1{
      font-size:clamp(1.15rem,3vw,1.45rem);
      font-weight:700;
      max-width:36ch;
      margin-bottom:8px;
      opacity:0;
      transform:translateY(20px);
    }
    .sub{
      color:var(--muted);
      font-size:.98rem;
      max-width:42ch;
      line-height:1.55;
      margin-bottom:28px;
      opacity:0;
      transform:translateY(20px);
    }
    .lang-row{display:flex;gap:8px;justify-content:center;margin-bottom:24px;opacity:0}
    .lang-row button{
      border:1px solid var(--hair);
      border-radius:10px;
      background:rgba(255,255,255,.04);
      color:var(--text);
      padding:8px 12px;
      font-size:.72rem;
      letter-spacing:.12em;
      text-transform:uppercase;
      font-family:var(--mono);
      cursor:pointer;
      transition:border-color .2s,background .2s;
    }
    .lang-row button.on{border-color:rgba(85,167,255,.55);background:rgba(85,167,255,.12)}
    .links{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      justify-content:center;
      max-width:520px;
      opacity:0;
      transform:translateY(20px);
    }
    .links a{
      border:1px solid var(--hair);
      border-radius:14px;
      padding:12px 16px;
      text-decoration:none;
      color:var(--text);
      font-weight:700;
      font-size:.9rem;
      background:rgba(255,255,255,.03);
      transition:border-color .2s,transform .2s;
    }
    .links a:hover{border-color:rgba(85,167,255,.5);transform:translateY(-2px)}
    .home{margin-top:28px;opacity:0}
    .home a{
      font-family:var(--mono);
      font-size:.78rem;
      letter-spacing:.1em;
      text-transform:uppercase;
      color:var(--accent);
      text-decoration:none;
      font-weight:800;
    }
    .home a:hover{text-decoration:underline}
    a:focus-visible,button:focus-visible{outline:2px solid rgba(85,167,255,.8);outline-offset:3px}
    main{display:flex;flex-direction:column;align-items:center;width:100%;max-width:100%}
  </style>
</head>
<body>
  <main id="main">
    <div class="code" aria-hidden="true">404</div>
    <h1 data-i18n="h1">Táto stránka neexistuje.</h1>
    <p class="sub" data-i18n="sub">Adresa môže byť zastaralá alebo ste sa pomýlili v URL. Vyberte jednu z častí webu nižšie.</p>
    <div class="lang-row" aria-label="Jazyk">
      <button type="button" class="on" data-lang="sk">SK</button>
      <button type="button" data-lang="de">DE</button>
    </div>
    <nav class="links" aria-label="Navigácia">
      <a href="/" data-i18n="nav0">Úvod</a>
      <a href="/foto/" data-i18n="nav1">Design Studio / Foto</a>
      <a href="/weby/" data-i18n="nav2">Weby &amp; e-shopy</a>
      <a href="/elektro/" data-i18n="nav3">Automatizácia</a>
    </nav>
    <p class="home"><a href="/" data-i18n="back">← Späť na úvod</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="./js/story-engine.js"></script>
  <script>
    /* Three.js background only — no scroll/Lenis needed */
    gsap.registerPlugin(ScrollTrigger);
    (function(){
      var isMobile = /Mobi|Android/i.test(navigator.userAgent) || window.innerWidth < 768;
      if(!isMobile && typeof THREE !== 'undefined'){
        var VS='varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.0);}';
        var FS=[
          'precision highp float;uniform float uTime;uniform vec2 uMouse;uniform vec2 uRes;varying vec2 vUv;',
          'vec3 permute(vec3 x){return mod(((x*34.0)+1.0)*x,289.0);}',
          'float snoise(vec2 v){const vec4 C=vec4(.211324865405187,.366025403784439,-.577350269189626,.024390243902439);vec2 i=floor(v+dot(v,C.yy));vec2 x0=v-i+dot(i,C.xx);vec2 i1=(x0.x>x0.y)?vec2(1,0):vec2(0,1);vec4 x12=x0.xyxy+C.xxzz;x12.xy-=i1;i=mod(i,289.0);vec3 p=permute(permute(i.y+vec3(0,i1.y,1))+i.x+vec3(0,i1.x,1));vec3 m=max(.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.0);m=m*m;m=m*m;vec3 x=2.0*fract(p*C.www)-1.0;vec3 h=abs(x)-.5;vec3 ox=floor(x+.5);vec3 a0=x-ox;m*=1.79284291400159-.85373472095314*(a0*a0+h*h);vec3 g;g.x=a0.x*x0.x+h.x*x0.y;g.yz=a0.yz*x12.xz+h.yz*x12.yw;return 130.0*dot(m,g);}',
          'float fbm(vec2 p){float v=0.0,a=.5;for(int i=0;i<5;i++){v+=a*snoise(p);p*=2.0;a*=.5;}return v;}',
          'void main(){vec2 uv=vUv;vec2 asp=vec2(uRes.x/uRes.y,1.0);float md=length((uv-uMouse)*asp);float mi=smoothstep(.55,0.0,md)*.12;float t=uTime*.06;',
          'vec2 q=vec2(fbm(uv*2.8+vec2(t*.4,t*.3)),fbm(uv*2.8+vec2(5.2,1.3)+t*.2));vec2 r=vec2(fbm(uv*2.8+4.0*q+vec2(1.7,9.2)+(uv-uMouse)*mi*6.0),fbm(uv*2.8+4.0*q+vec2(8.3,2.8)+(uv-uMouse)*mi*6.0));float f=fbm(uv*2.8+4.0*r);',
          'float b1=smoothstep(-.6,.6,f);float b2=smoothstep(-.4,.4,q.x);',
          'vec3 cA=vec3(.06,.04,.12);vec3 cB=vec3(.04,.10,.20);vec3 cC=vec3(.10,.04,.16);',
          'vec3 col=mix(cA,cB,b1);col=mix(col,cC,b2*.55);col+=mi*.7*cB;',
          'col*=1.0-smoothstep(.45,1.5,length((uv-.5)*1.7))*.55+.45;',
          'col+=fract(sin(dot(uv*uTime,vec2(12.9898,78.233)))*43758.5453)*.035-.0175;col*=.32;',
          'gl_FragColor=vec4(col,1.0);}'
        ].join('\n');
        var canvas=document.createElement('canvas');
        canvas.style.cssText='position:fixed;inset:0;z-index:-10;width:100%;height:100%;pointer-events:none';
        document.body.prepend(canvas);
        var ren=new THREE.WebGLRenderer({canvas:canvas,antialias:false});
        ren.setSize(window.innerWidth,window.innerHeight);
        ren.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
        var sc=new THREE.Scene(),cam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
        var mat=new THREE.ShaderMaterial({vertexShader:VS,fragmentShader:FS,uniforms:{uTime:{value:0},uMouse:{value:new THREE.Vector2(.5,.5)},uRes:{value:new THREE.Vector2(window.innerWidth,window.innerHeight)}}});
        sc.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat));
        var mx=.5,my=.5,tx=.5,ty=.5;
        document.addEventListener('mousemove',function(e){tx=e.clientX/window.innerWidth;ty=1-e.clientY/window.innerHeight;},{passive:true});
        window.addEventListener('resize',function(){ren.setSize(window.innerWidth,window.innerHeight);mat.uniforms.uRes.value.set(window.innerWidth,window.innerHeight);});
        (function loop(t){requestAnimationFrame(loop);mat.uniforms.uTime.value=t*.001;mx+=(tx-mx)*.045;my+=(ty-my)*.045;mat.uniforms.uMouse.value.set(mx,my);ren.render(sc,cam);})(0);
      }
    })();

    /* Entrance animations */
    gsap.to('.code',{opacity:1,y:0,scale:1,duration:1.2,delay:.2,ease:'power3.out'});
    gsap.to('h1',{opacity:1,y:0,duration:.8,delay:.5,ease:'power2.out'});
    gsap.to('.sub',{opacity:1,y:0,duration:.8,delay:.65,ease:'power2.out'});
    gsap.to('.lang-row',{opacity:1,duration:.6,delay:.8,ease:'power2.out'});
    gsap.to('.links',{opacity:1,y:0,duration:.8,delay:.9,ease:'power2.out'});
    gsap.to('.home',{opacity:1,duration:.6,delay:1.1,ease:'power2.out'});

    /* i18n */
    var T={
      sk:{h1:"Táto stránka neexistuje.",sub:"Adresa môže byť zastaralá alebo ste sa pomýlili v URL. Vyberte jednu z častí webu nižšie.",nav0:"Úvod",nav1:"Design Studio / Foto",nav2:"Weby & e-shopy",nav3:"Automatizácia",back:"← Späť na úvod"},
      de:{h1:"Diese Seite existiert nicht.",sub:"Die Adresse ist veraltet oder die URL war falsch. Wählen Sie unten einen Bereich.",nav0:"Start",nav1:"Design Studio / Foto",nav2:"Websites & Shops",nav3:"Automatisierung",back:"← Zurück zur Startseite"}
    };
    var els=document.querySelectorAll('[data-i18n]');
    var btns=document.querySelectorAll('.lang-row button');
    function setL(lang){
      var p=T[lang];if(!p)return;
      document.documentElement.lang=lang;
      els.forEach(function(el){var k=el.getAttribute('data-i18n');if(p[k])el.textContent=p[k];});
      btns.forEach(function(b){b.classList.toggle('on',b.dataset.lang===lang);});
      try{localStorage.setItem('td-lang',lang);}catch(e){}
    }
    btns.forEach(function(b){b.addEventListener('click',function(){setL(b.dataset.lang);});});
    try{var saved=localStorage.getItem('td-lang');if(saved==='de'||saved==='sk')setL(saved);}catch(e){}
  </script>
</body>
</html>
